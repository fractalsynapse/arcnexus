id: delivery
kind: plugin
purpose: Integrate the accepted candidate through one staging PR.
objectives:
  - measure: The recorded staging merge corresponds to the one verified task candidate.
constraints:
  - failure: Delivery changes an accepted candidate, bypasses a gate or replays an
      uncertain effect.
owns:
  - packages/delivery
  - .arc/research/delivery
activities:
  research:
    role: researcher
    profile: gpt-astra
    instructions:
      - Resolve the verified candidate identity and the provider observation
        needed to deliver it.
    operations:
      - read-file
      - list-files
    standards: [ agent-operating-protocol ]
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
      - State the staging gates and failure behavior at the delivery boundary.
    operations:
      - read-file
      - list-files
      - ask-question
      - request-research
      - checked-edit
      - archive-research
      - request-supplier
    standards: [ agent-operating-protocol ]
  testing:
    role: designer
    profile: gpt-terra
    instructions:
      - Exercise a wrong candidate, changed upstream state, pending checks and
        recorded merge.
    operations:
      - read-file
      - list-files
      - ask-question
      - request-research
      - checked-edit
      - archive-research
      - request-supplier
      - owner-format
      - owner-lint
      - repository-types
      - repository-build
      - owner-tests
    standards:
      - readable-typescript
      - agent-operating-protocol
    verification:
      - owner-format
      - owner-lint
      - repository-types
      - repository-build
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
      - Carry the verified candidate through the configured staging route and
        retain its attribution.
    operations:
      - read-file
      - list-files
      - ask-question
      - request-research
      - checked-edit
      - archive-research
      - request-supplier
      - owner-format
      - owner-lint
      - repository-types
      - repository-build
      - owner-tests
    standards:
      - readable-typescript
      - agent-operating-protocol
    verification:
      - owner-format
      - owner-lint
      - repository-types
      - repository-build
      - owner-tests
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
      - Check exact candidate identity, observed gates, and refusal to perform
        protected actions.
    operations:
      - read-file
      - list-files
      - ask-question
      - request-research
      - request-supplier
    standards:
      - readable-typescript
      - agent-operating-protocol
  release:
    role: release-engineer
    executor: host
    instructions:
      - Integrate the accepted staging candidate only after configured gates
        pass.
    operations: []
    standards: []
