schemaVersion: 6
id: operations
type: library
parentId: cli-package
purpose:
  Execute declared commands, supervise services and reconcile authorized upstream effects through captured
  providers
objectives: [
    Execute captured engineering operations and preserve their evidence,
    Stop managed subprocesses and
    services when their execution scope ends,
  ]
constraints: [
    Never infer setup commands or broaden captured operation authority,
    Preserve caller cancellation and
    resource ownership checks,
    'operation (src/library/operations/schemas/operation.json): Preserve supported historical
    versions and captured execution readers',
    'command-diagnostics (src/library/operations/diagnostics.ts): Keep
    model-facing excerpts within 16 KiB and preserve complete raw logs separately',
  ]
activities:
  research:
    role: researcher
    profile: luna
    operations: []
    instructions: [
        "Establish what Execute declared commands, supervise services and reconcile authorized upstream
        effects through captured providers means in practice from this component's own sources and retained evidence
        before proposing any change to src/library/operations.",
      ]
  documentation:
    role: technical-writer
    profile: luna
    operations: []
    instructions: [
        'Keep the documentation under docs/library/operations describing Execute declared commands, supervise
        services and reconcile authorized upstream effects through captured providers as delivered behaviour, never
        as intent.',
      ]
  testing:
    role: designer
    profile: luna
    operations: []
    instructions: [
        'Express acceptance for Execute declared commands, supervise services and reconcile authorized
        upstream effects through captured providers as checks over its declared public contract in tests/library/operations;
        observe the failure before changing behaviour.',
      ]
  implementation:
    role: systems-engineer
    profile: luna
    operations: []
    instructions: [
        'Change only what this goal requires inside src/library/operations, preserving the public contract
        and the ownership boundaries that declare it.',
      ]
  review:
