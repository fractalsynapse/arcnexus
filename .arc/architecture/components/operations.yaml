    profile: luna
    operations: []
    instructions: [
        'Judge the candidate against the stated acceptance and the standards in force for Execute declared
        commands, supervise services and reconcile authorized upstream effects through captured providers; refuse
        on unmet behaviour rather than style.',
      ]
