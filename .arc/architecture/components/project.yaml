id: project
kind: project
purpose: Maintain project direction, repository delivery policy and recorded architect decisions.
objectives:
- measure: The current project catalog and contract registry agree.
constraints:
- failure: A candidate changes the authority captured for its own task.
owns:
- .agents
- .arc
- .github
- .gitignore
- AGENTS.md
- CHANGELOG.md
- LICENSE
- README.md
- docs/charter.md
- docs/dev.md
- docs/interface
- docs/plans
- docs/release
activities:
  research:
    role: researcher
    profile: gpt-astra
    instructions:
    - Find the governing architectural decision and identify any conflict requiring architect approval.
    operations: []
    standards: []
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
    - Record the architect’s intent and link the canonical contract or catalog entry.
    operations: []
    standards: []
  testing:
    role: designer
    profile: gpt-sol
    instructions:
    - Walk through changes to authority, ownership and required gates against the captured baseline.
    operations: []
    standards: []
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
    - Keep root guidance, project policy and recorded approvals consistent.
    operations: []
    standards: []
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
    - Check that the proposed guidance leaves captured authority and independent acceptance intact.
    operations: []
    standards: []
