        Review the real execution boundary rather than a simulated happy path alone. Inspect the production app wiring, actual provider request representation, activity-scoped MCP tools, checked-edit receipts, candidate preparation, checkpoint pushes and worktree cleanup. Verify that allowed web access is provider policy and that no raw shell or unapproved native tool becomes available through a fallback.

        Read the native regression artifacts for actual versions, commands, environment, messages/results and failures. Test fakes must be isolated from live credentials and honestly labeled. Look for assignment-shaped assembly fixtures, lost original findings, repeated acknowledged edits, incomplete answers, arbitrary request/output limits and reports that turn unknown usage into zero.

        Route an owned provider, fixture or confinement defect to the earliest applicable local activity, preserving successful edits and prior evidence. If no earlier Testing target exists, Implementation can repair its owned tests in place rather than request an impossible self-rewind. This read-only review cannot launch checks, edit a candidate, approve a PR or waive assembled verification. A successful checkpoint remains distinct from independent acceptance and staging integration.
