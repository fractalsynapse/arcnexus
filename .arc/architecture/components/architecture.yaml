id: architecture
kind: plugin
purpose: Maintain the project architecture and resolve its captured authority and model context.
objectives:
- measure: A clean catalog validates and repeated captures of a revision agree.
constraints:
- failure: A candidate changes captured authority or a private import crosses ownership.
owns:
- packages/architecture
- .arc/architecture
- .arc/README.md
- README.md
- docs/interface
- .arc/research/architecture
activities:
  updating:
    role: architect
    profile: gpt-sol
    instructions:
    - Assess approved objectives and goals, current architecture and implementation, and relevant prior execution findings.
    - Return a justified no-change assessment or one exact proposal with purpose, consequences and required implementation outcomes.
    - Preserve captured authority. Only the trusted host may apply the exact human-approved protected diff.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - request-supplier
    standards: []
  research:
    role: researcher
    profile: gpt-astra
    instructions:
    - Locate the authoritative declaration or capture that controls the behavior.
    operations:
    - read-file
    - list-files
    standards: []
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
    - Maintain the architecture guide and explain validated catalog and context behavior.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    standards: []
  testing:
    role: designer
    profile: gpt-terra
    instructions:
    - Exercise missing activity fields, invalid references and immutable captured authority.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
    standards:
    - readable-typescript
    verification:
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
    - Maintain the architect-approved catalog and resolve ownership and context from its authored definitions.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
    standards:
    - readable-typescript
    verification:
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
    - Check architect authority, deterministic validation and frozen capture semantics.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - request-supplier
    standards:
    - readable-typescript
