id: agent
kind: plugin
purpose: Expose one scoped Agent for inspection and activation of directors, stewards and reviewers.
objectives:
- measure: All three actor roles use the same Agent interface and inspection matches the Codex request
    for the same inputs.
constraints:
- failure: An actor can observe data or perform an operation outside captured authority, or bypass the
    single execution lane.
owns:
- packages/agent
- .arc/research/agent
activities:
  research:
    role: researcher
    profile: gpt-astra
    instructions:
    - Identify which observation or operation the current actor needs from its captured scope.
    operations:
    - read-file
    - list-files
    standards: []
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
    - Describe the shared Agent view and activity boundary before changing activation behavior.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    standards: []
  testing:
    role: designer
    profile: gpt-terra
    instructions:
    - Exercise inspect-to-harness parity, activity changes and refused capabilities.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
    standards:
    - readable-typescript
    verification:
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
    - Expose the resolved actor and delegate one bounded activation to Execution.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
    standards:
    - readable-typescript
    verification:
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
    - Check equivalent inspection and activation, including director and reviewer read-only scope.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - request-supplier
    standards:
    - readable-typescript
