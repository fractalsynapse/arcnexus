id: direction
kind: plugin
purpose: Turn goals and supplier requests into a sequence of accountable milestones.
objectives:
- measure: A supplier request preserves the owner and acceptance and places required work first.
constraints:
- failure: A milestone acquires two owners or the director grants itself write authority.
owns:
- packages/direction
- .arc/plans
- .arc/research/direction
activities:
  research:
    role: researcher
    profile: gpt-astra
    instructions:
    - Investigate external facts and alternatives that can change goal interpretation, feasibility or sequencing.
    operations:
    - read-file
    - list-files
    standards: []
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
    - Describe planning, reuse and escalation as observable outcomes and keep the plan file a reviewable
      render.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    standards: []
  testing:
    role: designer
    profile: gpt-terra
    instructions:
    - Exercise a two-owner task, unavailable supplier and preserved acceptance.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-tests
    standards:
    - readable-typescript
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
    - Author and sequence plans in Direction. Use Coordination’s persisted state and deterministic render.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-tests
    standards:
    - readable-typescript
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
    - Check that plan changes preserve the goal, one owner per milestone and the one task lane.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - request-supplier
    standards:
    - readable-typescript
  planning:
    role: director
    profile: gpt-sol
    instructions:
    - Use the captured Team component IDs in the plan so supplier links resolve to the same owners.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    standards: []
