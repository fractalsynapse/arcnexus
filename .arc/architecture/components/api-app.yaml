id: api-app
kind: app
purpose: |
  Adapt project-scoped Data resources to the trusted platform api transport.
objectives:
  - measure: Authorized callers read the same owner-defined resources and cursor through the gateway.
constraints:
  - failure: The gateway creates a task lane, reinterprets approvals, or queries another project's journal.
owns:
  - apps/api
activities:
  implementation:
    role: systems-engineer
    profile: gpt-sol
    instructions:
      - |
        Reuse the Data SDK for declarations and handlers. Authenticate and bind
        project context before any resource access.
    operations:
      [list-files, read-file, checked-edit, owner-format, owner-lint, repository-types, owner-tests]
    standards: [readable-typescript, agent-operating-protocol]
    verification: [owner-format, owner-lint, repository-types, owner-tests]
