id: collaboration
kind: plugin
purpose: Expose the provider interface and GitHub operations to trusted host services.
objectives:
- measure: A provider-observed merge identifies the verified head and resulting commit.
constraints:
- failure: A steward obtains upstream credentials or a changed head can be merged.
owns:
- packages/collaboration
- .arc/research/collaboration
activities:
  research:
    role: researcher
    profile: gpt-astra
    instructions:
    - Establish the provider observation needed to confirm the intended upstream effect.
    operations:
    - read-file
    - list-files
    standards: []
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
    - Describe the provider operation, its authorized input and the returned observation.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    standards: []
  testing:
    role: designer
    profile: gpt-terra
    instructions:
    - Use an isolated provider fixture to exercise changed heads, checks and unavailable results.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-tests
    standards:
    - readable-typescript
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
    - Perform only the host-authorized GitHub operation and report the observed identity.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-tests
    standards:
    - readable-typescript
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
    - Check that provider calls stay outside agent authority and cannot merge a changed head.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - request-supplier
    standards:
    - readable-typescript
