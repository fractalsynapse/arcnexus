id: foundation
kind: plugin
purpose: Provide shared build and verification tooling.
objectives:
- measure: An owner test selection executes exactly that owner’s suites.
constraints:
- failure: A check writes outside its declared generated roots.
owns:
- packages/foundation
- docs/foundation
- scripts
- package.json
- package-lock.json
- .prettierignore
- .prettierrc.yaml
- eslint.config.ts
- tsconfig.json
- tsconfig.build.json
- tsconfig.fixtures.json
- tsconfig.tests.json
- tsconfig.tooling.json
