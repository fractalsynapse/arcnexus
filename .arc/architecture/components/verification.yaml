id: verification
kind: plugin
purpose: Assess one assembled task candidate against the captured acceptance.
objectives:
- measure: One independent verdict cites evidence for the engineering criteria and the original goal.
constraints:
- failure: A missing required check counts as passed or a changed digest reuses a verdict.
owns:
- packages/verification
- .arc/research/verification
activities:
  research:
    role: researcher
    profile: gpt-astra
    instructions:
    - Trace an acceptance criterion to its captured check and evidence input.
    operations:
    - read-file
    - list-files
    standards: []
  documentation:
    role: technical-writer
    profile: gpt-sol
    instructions:
    - Specify verdict identity, evidence completeness and unavailable outcomes.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    standards: []
  testing:
    role: designer
    profile: gpt-terra
    instructions:
    - Exercise stale verdicts, missing evidence and recorded expected-red checks.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
    standards:
    - readable-typescript
    verification:
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
  implementation:
    role: systems-engineer
    profile: gpt-luna
    instructions:
    - Implement one acceptance and verdict path for the assembled candidate.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - checked-edit
    - archive-research
    - request-supplier
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
    standards:
    - readable-typescript
    verification:
    - owner-format
    - owner-lint
    - repository-types
    - repository-build
    - owner-tests
  review:
    role: self-reviewer
    profile: gpt-sol
    instructions:
    - Check the verifier implementation against its contract without authorizing candidate delivery.
    operations:
    - read-file
    - list-files
    - ask-question
    - request-research
    - request-supplier
    standards:
    - readable-typescript
