schemaVersion: 6
id: architecture-maintenance
type: library
parentId: cli-package
purpose: Maintain architectural ownership definitions under caller authority
objectives:
- Maintain readable definitions with accountable, disjoint ownership
- Propose architectural changes with explicit acceptance criteria
constraints:
- Caller accepts architectural authority changes
- Candidate definition edits never change authority for an active execution
activities:
  research:
    role: researcher
    profile: luna
    operations: []
    instructions:
    - Establish what Maintain architectural ownership definitions under caller authority means in practice
      from this component's own sources and retained evidence before proposing any change to README.md,
      CHANGELOG.md.
  documentation:
    role: technical-writer
    profile: luna
    operations: []
    instructions:
    - Keep the documentation under docs/charter.md describing Maintain architectural ownership definitions
      under caller authority as delivered behaviour, never as intent.
  implementation:
    role: systems-engineer
    profile: luna
    operations: []
    instructions:
    - Change only what this goal requires inside README.md, CHANGELOG.md, preserving the public contract
      and the ownership boundaries that declare it.
  review:
    role: reviewer
    profile: luna
    operations: []
    instructions:
    - Judge the candidate against the stated acceptance and the standards in force for Maintain architectural
      ownership definitions under caller authority; refuse on unmet behaviour rather than style.
owns:
- README.md
- CHANGELOG.md
- docs/charter.md
- docs/dev.md
