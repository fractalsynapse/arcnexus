id: owner-tests
purpose: >
  Run built test suites owned by the current component, optionally narrowed by
  declared tags, levels and literal source or built paths.
kind: command
tool: check
category: integration-test
command: npm
args:
- test
- --
- context: owner
- parameter: selectors
cwd: .
network: false
applicability: owner-test-suites
parameters:
  selectors:
    type: array
    items:
      type: string
    default: []
