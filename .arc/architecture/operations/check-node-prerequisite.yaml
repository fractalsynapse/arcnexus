id: check-node-prerequisite
purpose: Project prerequisites
kind: command
category: cli-check
command: node
args:
  - -e
  - if(process.versions.node.split('.')[0]!=='22')process.exit(1)
cwd: .
network: true
generatedDirectories:
  - .fixture-build
  - .test-build
  - .tool-build
  - dist
  - node_modules
artifacts: []
prerequisites: []
