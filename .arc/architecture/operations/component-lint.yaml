id: component-lint
purpose: Read-only lint feedback for the active owner
kind: command
category: lint
command: node
args:
  - node_modules/eslint/bin/eslint.js
  - --no-error-on-unmatched-pattern
  - --no-warn-ignored
  - context: ownedPaths
cwd: .
generatedDirectories: []
artifacts: []
prerequisites:
  - project-setup
