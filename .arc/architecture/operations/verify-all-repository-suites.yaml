id: verify-all-repository-suites
purpose: Verify all repository suites
kind: command
category: cli-check
command: node
args:
  - --test
  - .test-build/**/*.test.js
cwd: .
network: true
generatedDirectories:
  - .fixture-build
  - .test-build
  - .tool-build
  - dist
  - node_modules
artifacts: []
prerequisites:
  - verify-guidance-validation
  - prepare-tests
