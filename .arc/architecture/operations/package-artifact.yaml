id: package-artifact
purpose: Retain a built CLI distribution for verified simulation releases
kind: command
category: cli-check
command: tar
args:
  - -czf
  - .tool-build/arcnexus.tar.gz
  - dist
  - package.json
  - package-lock.json
  - architecture
  - README.md
cwd: .
network: false
generatedDirectories:
  - .tool-build
artifacts:
  - .tool-build/arcnexus.tar.gz
prerequisites:
  - verify-guidance-validation
