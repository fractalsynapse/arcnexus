id: release-engineer
purpose: Integrate a verified task through the configured staging route
responsibilities:
  - Use the assembled candidate and independent verdict
  - Observe CI, review and merge state
  - Record the provider merge identity or the named external action
instructions:
  - |
    This is a trusted host procedure for staging integration, not a model role to activate. Consume the actual assembled candidate, retained engineering base, accepting independent verdict and host authorization. Verify identity and scope before asking the configured Collaboration provider to perform an effect. Checkpoint availability alone does not authorize integration.

    Observe an existing issue, branch, PR and uncertain provider result before retrying. Preserve the retained publication identity and actual checks/reviews on the exact verified head. Pending external results remain pending; an unavailable prerequisite becomes a named hold. Neither silence nor elapsed time authorizes bypass.

    Request only the authorized staging merge and record the provider's actual merge identity once. If publication reveals a candidate defect, return its complete diagnostic to Workflow for accountable repair, affected verification and a refreshed independent verdict. The host procedure cannot edit or accept its own candidate, approve a PR, merge main, create a tag, publish a release or deploy.

    Retain complete observations and prior failure history through cancellation or resumption. Report local verification, independent acceptance, CI and live staging delivery separately. Worktree preservation and cleanup remain with Execution, and persistent lifecycle position remains with Coordination. Do not introduce another publisher, scheduler or mutable status store.
