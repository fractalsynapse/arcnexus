name: Verification
on:
  workflow_call:
    inputs:
      distribution:
        type: boolean
        default: false
        required: false
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Normalize declared HTTPS repository identity
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Install product dependencies
        run: npm ci
      - name: Install confinement runtime
        run: |
          sudo npm install --global --prefix /usr/local --ignore-scripts @openai/codex@0.163.0-alpha.10.2
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles apparmor-utils
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Bind verified machine executables
        run: |
          node --input-type=module <<'NODE'
          import { mkdirSync, writeFileSync } from 'node:fs';
          mkdirSync('.git/arcnexus', { recursive: true });
          writeFileSync('.git/arcnexus/bindings.yaml', JSON.stringify({
            schemaVersion: 1,
            tools: { node: process.execPath, codex: '/usr/local/bin/codex' },
            repositories: {},
          }));
          NODE
      - name: Check formatting
        run: npm run format:check
      - name: Lint maintained code
        run: npm run lint
      - name: Check TypeScript
        run: npm run check
      - name: Test built CLI
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --wait --pipe --collect npm test
      - name: Qualify native project hosts
        run: |
          sudo systemd-run --uid="$(id -u)" --gid="$(id -g)" \
            --property=Delegate=yes --working-directory="$PWD" \
            --setenv="PATH=$PATH" --setenv=ARCNEXUS_TEST_CODEX=/usr/local/bin/codex \
            --wait --pipe --collect node scripts/release/native-host-tests.mjs
      - name: Retain failed operation diagnostics
        if: failure()
        run: |
          if [[ -d "$HOME/.local/state/arcnexus" ]]; then
            find "$HOME/.local/state/arcnexus" -type f -name '*.log' -exec tail -n 40 -- {} +
          fi
          for directory in /tmp/arcnexus-op-*/qualification; do
            if [[ -d "$directory" ]]; then
              find "$directory" -type f -name '*.log' -exec tail -n 40 -- {} +
            fi
          done
      - name: Validate architectural ownership
        run: node dist/cli.js validate --project .
      - name: Smoke-test CLI
        run: node dist/cli.js --help
      - name: Validate repository guidance
        run: node dist/cli.js guidance validate --project .
      - name: Check changed-line whitespace
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [[ -z "$BASE_SHA" || "$BASE_SHA" =~ ^0+$ ]]; then
            BASE_SHA=$(git hash-object -t tree /dev/null)
          fi
          git diff --check "$BASE_SHA" HEAD
      - name: Verify assembled distribution
        if: inputs.distribution
        run: |-
          node dist/cli.js --version
          test -x dist/cli.js
          node --input-type=module -e "import { readFileSync } from 'node:fs'; const registry = JSON.parse(readFileSync('dist/library/architecture/schema-registry.json', 'utf8')); if (!Object.keys(registry).length) process.exit(1);"
