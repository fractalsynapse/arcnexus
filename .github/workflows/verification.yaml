name: Verification
on:
  workflow_call:
    inputs:
      distribution:
        type: boolean
        default: false
        required: false
      native:
        type: boolean
        default: true
        required: false
      ref:
        type: string
        default: ''
        required: false
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-26.04
    timeout-minutes: 360
    steps:
      - name: Check out source
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Normalize declared HTTPS repository identity
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      
      - name: Install product dependencies
        run: npm ci
      
      - name: Check formatting
        run: npm run format:check
      - name: Lint maintained code
        run: npm run lint
      - name: Check TypeScript
        run: npm run check
