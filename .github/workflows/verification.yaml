name: Verification
on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
        required: false
permissions:
  contents: read
jobs:
  repository:
    name: Repository checks
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}

      - name: Normalize declared HTTPS repository identity
        run: git remote set-url origin "https://github.com/${{ github.repository }}.git"
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Install product dependencies
        run: npm ci

      - name: Check project specification
        id: specification
        run: npm run check:specification

      - name: Check formatting
        if: steps.specification.outputs.executable == 'true'
        run: npm run format:check
      - name: Lint maintained code
        if: steps.specification.outputs.executable == 'true'
        run: npm run lint
      - name: Check TypeScript
        if: steps.specification.outputs.executable == 'true'
        run: npm run check
      - name: Install Chromium for web acceptance
        if: steps.specification.outputs.executable == 'true'
        run: npx --no-install playwright install --with-deps chromium
      - name: Build and test app and plugin suites
        if: steps.specification.outputs.executable == 'true'
        run: npm test
