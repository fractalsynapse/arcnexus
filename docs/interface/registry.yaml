# Walk order. A contract is added here when its stage begins; it leaves the queue only by
# being proposed and then locked by the architect.
queue:
  stage: libraries
  waiting:
    - arcnexus/architecture-model
    - arcnexus/coordination
    - arcnexus/execution
    - arcnexus/direction
    - arcnexus/verification
    - arcnexus/delivery
    - arcnexus/report
    - arcnexus/guidance
    - arcnexus/testing
  then:
    - arcnexus/release
