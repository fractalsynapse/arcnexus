    digest: 0d9e080b6d791496f1fea3ac6a4c178bf54e13a1d8a0ff5a664127bd4010bad6
    note: >
      Planning contract, not an interface contract. Gained a Contracts category and the rule
      that a milestone touching a locked interface becomes a change request, not engineering.
      Amended under the architect's direction that the activities a role declares are the one
      activity vocabulary: checklist items key on `activity` (six canonical names, canonical
      order), the plan must declare every supported activity even when it carries no items, and
      buckets run in that order without ever substituting for the verdict.

# Walk order. A contract is added here when its stage begins; it leaves the queue only by
# being proposed and then locked by the architect.
