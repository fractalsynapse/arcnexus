<div id="arc-preview" aria-label="ArcNexus MVP · retained refinement round">
  <header class="arc-header">
    <button type="button" class="arc-brand" data-go="/plan/" aria-label="ArcNexus home">
      <img class="arc-mark" src="brand/brain.webp" alt="" width="24" height="24">
      <picture>
        <source media="(prefers-color-scheme: dark)" srcset="brand/wordmark-dark.webp">
        <img src="brand/wordmark.webp" alt="ArcNexus" width="146" height="20">
      </picture>
    </button>
    <nav class="arc-nav" aria-label="Workspace">
      <button type="button" data-go="/plan/"><i data-lucide="compass" aria-hidden="true"></i>Plan</button>
      <button type="button" data-go="/architect/"><i data-lucide="layers-3" aria-hidden="true"></i>Architect</button>
      <button type="button" data-go="/run/"><i data-lucide="workflow" aria-hidden="true"></i>Run</button>
    </nav>
    <div class="arc-header-action"></div>
  </header>
  <main class="arc-main"></main>
  <footer class="arc-console" aria-label="Command controls">
    <div class="arc-compose-state"></div>
    <form class="arc-launch">
      <label>Operation<select name="operation"><option value="plan">Plan</option><option value="architect">Architect</option><option value="run">Run</option><option value="steer">Steer</option><option value="answer" hidden>Answer</option></select></label>
      <label><span class="arc-instruction-label">Instruction <small>optional</small></span><textarea name="instruction" rows="1" placeholder="Add an instruction…"></textarea></label>
      <button class="arc-button solid arc-launch-button" type="button" data-action="apply-form" aria-label="Send" data-tooltip="Send"><span class="arc-play" aria-hidden="true"></span></button>
    </form>
    <div class="arc-command" aria-live="polite"></div>
  </footer>
  <dialog class="arc-inspector" aria-labelledby="arc-inspector-heading">
    <div class="arc-panel-head"><h2 id="arc-inspector-heading"></h2><button type="button" class="arc-button" data-action="close-inspector" autofocus>Close</button></div>
    <div class="arc-inspector-content"></div>
  </dialog>
</div>
