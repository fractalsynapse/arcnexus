schemaVersion: 6
id: publisher
type: library
parentId: cli-package
purpose: Retain verified deliveries and advance policy-authorized integration and publication
objectives:
  - Verify and publish assembled dependent contributions through one delivery route
constraints:
  - Publication cannot substitute for independent engineering verification
  - Real main merges, tags and package publication remain human-controlled
operations:
  publish-delivery: [agent]
  package-artifact: [delivery]
owns:
  - src/library/publisher
  - tests/library/publisher
  - docs/library/publisher
api:
  - module: src/library/publisher/publisher.ts
