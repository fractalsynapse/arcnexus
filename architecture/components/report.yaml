schemaVersion: 6
id: report
type: library
parentId: cli-package
purpose: Project honest run, assignment and verification evidence without
  changing authority
objectives:
  - Make actual execution outcomes easy to inspect
  - Supply canonical execution facts and pinned artifacts to every model consumer
constraints:
  - Preserve JSON evidence and existing report fields except explicitly recorded terminal evidence expiration
  - Use the captured execution record without inspecting mutable target files
  - Preserve observed evidence and identify runtime changes across recovery
activities:
  research:
    role: researcher
    operations: [report-format]
  documentation:
    role: technical-writer
    operations: [report-format]
  testing:
    role: designer
    operations: [report-format]
  implementation:
    role: systems-engineer
    operations: [report-format]
  review:
    role: reviewer
    operations: [report-format]
operations:
  report-format:
    - agent
owns:
  - .arc/learning
  - src/library/report
  - tests/library/report
  - docs/library/report
api:
  - module: src/library/report/resource-query.ts
  - module: src/library/report/report.ts
  - module: src/library/report/timeline.ts
  - module: src/library/report/progress.ts
  - module: src/library/report/workday-report.ts
