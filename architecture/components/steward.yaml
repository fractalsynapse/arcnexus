schemaVersion: 6
id: steward
type: library
parentId: cli-package
purpose: Adapt the Codex harness with explicit execution permissions and evidence
objectives:
  - Research and implement bounded objectives with independently verified
    evidence
constraints:
  - Caller owns commits and integration
  - Do not edit architecture or weaken host verification
  - Implement only approved execution settings
activities:
  research:
    role: researcher
    operations: []
  documentation:
    role: technical-writer
    operations: []
  testing:
    role: designer
    operations: []
  implementation:
    role: systems-engineer
    operations: []
  review:
    role: reviewer
    operations: []
owns:
  - src/library/steward
  - tests/library/steward
  - docs/library/steward
api:
  - module: src/library/steward/bridge.ts
  - module: src/library/steward/codex.ts
