schemaVersion: 6
id: arcnexus
type: platform
purpose: Enable architecture-directed self-development
objectives: [Produce independently verifiable bounded work]
constraints: [
    Human architectural authority is final,
    Candidate changes cannot redefine active acceptance,
    'Native
    agent commits and upstream mutations are forbidden; only captured host operations may deliver changes. The director
    selects from all eligible project stewards, and dependency requests may activate further owners.',
  ]
executionProfile: luna
activities:
  research:
    role: researcher
    profile: sol
    operations: [component-format-check, component-lint, component-tests]
    instructions: [
        Establish what Enable architecture-directed self-development means in practice from this component's
        own sources and retained evidence before proposing any change to arcnexus.,
      ]
  documentation:
    role: technical-writer
    profile: sol
    operations: [component-format, component-format-check, component-lint]
    instructions: [
        'Keep the documentation under arcnexus describing Enable architecture-directed self-development
        as delivered behaviour, never as intent.',
      ]
  testing:
    role: designer
    profile: luna
    operations: [component-format, component-format-check, component-lint, component-tests]
    instructions: [
        Express acceptance for Enable architecture-directed self-development as checks over its declared
        public contract in arcnexus; observe the failure before changing behaviour.,
      ]
  implementation:
    role: systems-engineer
    profile: luna
    operations:
      [comment-issue, component-format, component-format-check, component-lint, component-tests]
    instructions: [
        'Change only what this goal requires inside arcnexus, preserving the public contract and the
        ownership boundaries that declare it.',
      ]
  review:
    role: reviewer
    profile: sol
    operations: [component-format-check, component-lint, component-tests]
    instructions: [
        Judge the candidate against the stated acceptance and the standards in force for Enable architecture-directed
        self-development; refuse on unmet behaviour rather than style.,
      ]
  release:
    role: release-engineer
    profile: luna
    operations:
      [
        migrated-recipe-43b539fb85a57c26,
        migrated-recipe-719d77e27c5d9798,
        migrated-recipe-df6d67ddacf5bf0c,
        migrated-recipe-f1691da2bfa5a18c,
        migrated-recipe-f36c9dcd75620b35,
      ]
    instructions: [
        'Publish only what the assembled verification accepted, and record exactly what shipped for Enable
        architecture-directed self-development.',
      ]
