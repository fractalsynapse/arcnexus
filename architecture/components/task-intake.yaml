schemaVersion: 6
id: task-intake
type: library
parentId: cli-package
purpose: Direct prompt tasks and independently assess goals and deliveries
objectives:
  - Interpret requests and identify accountable existing owners
  - Report missing responsibilities and architectural questions precisely
  - Independently assess assembled goal acceptance and reconsider decomposition
    without a participant ceiling
constraints:
  - Never silently broaden a captured assignment or grant write authority
  - Director and verifier activations are source-read-only and cannot apply
    architecture proposals
  - 'director-result (src/library/task-intake/schemas/director-result.json):
    General run proposals and safe retained continuations; preserve initializer
    history'
  - 'verification-result
    (src/library/task-intake/schemas/verification-result.json): Indexed
    independent acceptance evidence; preserve historical agent-result reports'
  - 'initializer-result
    (src/library/task-intake/schemas/initializer-result.json): Preserve
    supported historical versions and captured execution readers'
operations:
  track-issue:
    - agent
owns:
  - .arc/plans
  - src/library/task-intake
  - tests/library/task-intake
  - scripts/direction-probe.mjs
  - scripts/direction-corpus.json
  - docs/library/task-intake
api:
  - module: src/library/task-intake/direction.ts
  - module: src/library/task-intake/initializer.ts
  - module: src/library/task-intake/tasks.ts
  - schema: src/library/task-intake/schemas/director-result.json
  - schema: src/library/task-intake/schemas/verification-result.json
  - schema: src/library/task-intake/schemas/initializer-result.json
