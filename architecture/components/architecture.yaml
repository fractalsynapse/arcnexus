schemaVersion: 6
id: architecture
type: library
parentId: cli-package
purpose:
  Resolve architectural definitions and host-controlled assignment inputs; execution is owned by the assignment
  component
objectives: [Make actual execution outcomes easy to inspect]
constraints: [
    Preserve captured authority and evidence,
    'component-v4 (src/library/architecture/schemas/component-v4.json):
    Preserve supported historical versions and captured execution readers',
    'component (src/library/architecture/schemas/component.json):
    Preserve supported historical versions and captured execution readers',
    'composition-profile (src/library/architecture/schemas/composition-profile.json):
    Preserve supported historical versions and captured execution readers',
    'execution-profile (src/library/architecture/schemas/execution-profile.json):
    Preserve supported historical versions and captured execution readers',
    'ownership (src/library/architecture/schemas/ownership.json):
    Preserve supported historical versions and captured execution readers',
    'pattern (src/library/architecture/schemas/pattern.json):
    Preserve supported historical versions and captured execution readers',
    'role (src/library/architecture/schemas/role.json):
    Preserve supported historical versions and captured execution readers',
  ]
activities:
  research:
    role: researcher
    profile: luna
    operations: []
    instructions: [
        Establish what Resolve architectural definitions and host-controlled assignment inputs; execution
        is owned by the assignment component means in practice from this component's own sources and retained evidence
        before proposing any change to src/library/architecture.,
      ]
  documentation:
    role: technical-writer
    profile: luna
    operations: []
    instructions: [
        'Keep the documentation under docs/library/architecture describing Resolve architectural definitions
        and host-controlled assignment inputs; execution is owned by the assignment component as delivered behaviour,
        never as intent.',
      ]
  testing:
    role: designer
    profile: luna
    operations: []
    instructions: [
        Express acceptance for Resolve architectural definitions and host-controlled assignment inputs;
        execution is owned by the assignment component as checks over its declared public contract in tests/library/architecture;
        observe the failure before changing behaviour.,
      ]
  implementation:
    role: systems-engineer
    profile: luna
    operations: []
    instructions: [
        'Change only what this goal requires inside src/library/architecture, preserving the public contract
        and the ownership boundaries that declare it.',
      ]
  review:
    role: reviewer
    profile: luna
    operations: []
    instructions: [
        Judge the candidate against the stated acceptance and the standards in force for Resolve architectural
        definitions and host-controlled assignment inputs; execution is owned by the assignment component; refuse
        on unmet behaviour rather than style.,
      ]
owns: [src/library/architecture, tests/library/architecture, docs/library/architecture]
