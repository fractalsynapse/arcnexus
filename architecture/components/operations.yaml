  - module: src/library/operations/confinement.ts
  - module: src/library/operations/operation-definition.ts
  - module: src/library/operations/diagnostics.ts
  - module: src/library/operations/operations.ts
  - module: src/library/operations/probes.ts
  - module: src/library/operations/process.ts
  - module: src/library/operations/service-state.ts
