        behaviour.,
      ]
  implementation:
    role: systems-engineer
    profile: luna
    operations: []
    instructions: [
        'Change only what this goal requires inside src/library/experiments, experiments, preserving
        the public contract and the ownership boundaries that declare it.',
      ]
  review:
    role: reviewer
    profile: luna
    operations: []
    instructions: [
        Judge the candidate against the stated acceptance and the standards in force for Resolve and
        execute repeatable experiments with honestly labeled evidence; refuse on unmet behaviour rather than style.,
      ]
owns:
