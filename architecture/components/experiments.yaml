schemaVersion: 6
id: experiments
type: library
parentId: cli-package
purpose: Resolve and execute repeatable experiments with honestly labeled evidence
objectives: [
    Resolve and execute repeatable experiments with honestly labeled evidence,
    Migrate prompt-driven campaigns
    to the shared task execution host without fixed participants,
  ]
constraints: [
    Preserve captured assignment authority; candidate instructions cannot expand permissions,
    Caller owns
    commits and integration,
    'campaign (src/library/experiments/schemas/campaign.json): Preserve supported historical
    versions and captured execution readers',
    'experiment-bindings (src/library/experiments/schemas/experiment-bindings.json):
    Preserve supported historical versions and captured execution readers',
    'experiment-v2 (src/library/experiments/schemas/experiment-v2.json):
    Preserve supported historical versions and captured execution readers',
    'experiment (src/library/experiments/schemas/experiment.json):
    Preserve supported historical versions and captured execution readers',
    'experiment-v3 (src/library/experiments/schemas/experiment-v3.json):
    Prompt-driven cases preserve shared task authority and evidence',
  ]
activities:
  research:
    role: researcher
    profile: luna
    operations: []
    instructions: [
        "Establish what Resolve and execute repeatable experiments with honestly labeled evidence means
        in practice from this component's own sources and retained evidence before proposing any change to src/library/experiments,
        experiments.",
      ]
  documentation:
    role: technical-writer
    profile: luna
    operations: []
    instructions: [
        'Keep the documentation under docs/library/experiments describing Resolve and execute repeatable
