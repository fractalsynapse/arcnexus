schemaVersion: 5
id: experiments
type: library
parentId: cli-package
purpose: Resolve and execute repeatable experiments with honestly labeled evidence
objectives:
  - Resolve and execute repeatable experiments with honestly labeled evidence
  - Migrate prompt-driven campaigns to the shared task execution host without
    fixed participants
constraints:
  - Preserve captured assignment authority; candidate instructions cannot expand
    permissions
  - Caller owns commits and integration
  - "campaign (src/library/experiments/schemas/campaign.json): Preserve
    supported historical versions and captured execution readers"
  - "experiment-bindings
    (src/library/experiments/schemas/experiment-bindings.json): Preserve
    supported historical versions and captured execution readers"
  - "experiment-v2 (src/library/experiments/schemas/experiment-v2.json):
    Preserve supported historical versions and captured execution readers"
  - "experiment (src/library/experiments/schemas/experiment.json): Preserve
    supported historical versions and captured execution readers"
  - "experiment-v3 (src/library/experiments/schemas/experiment-v3.json):
    Prompt-driven cases preserve shared task authority and evidence"
operations:
  experiments-lint:
    - agent
  component-tests:
    - agent
  migrated-recipe-bdad07a41af09a66:
    - verify
  migrated-recipe-43b539fb85a57c26:
    - verify
  migrated-recipe-df6d67ddacf5bf0c:
    - verify
owns:
  - src/library/experiments
  - tests/library/experiments
  - docs/library/experiments
  - experiments
  - qualification
  - fixtures
  - docs/acceptance
  - scripts/check-permissions.mjs
  - scripts/check-report.mjs
  - scripts/check-sample.mjs
  - scripts/live-sample.mjs
  - scripts/qualification
  - scripts/qualify.mjs
api:
  - module: src/library/experiments/experiment-config.ts
  - module: src/library/experiments/experiments.ts
  - schema: src/library/experiments/schemas/campaign.json
  - schema: src/library/experiments/schemas/experiment-bindings.json
  - schema: src/library/experiments/schemas/experiment-v2.json
  - schema: src/library/experiments/schemas/experiment.json
  - schema: src/library/experiments/schemas/experiment-v3.json
