schemaVersion: 6
id: foundation
type: foundation
parentId: cli-package
purpose: Maintain package runtimes, TypeScript, build and shared programming standards
objectives:
  - Keep builds and deterministic tests reproducible
  - Maintain runtime, build, formatting and lint standards; release and testing
    own their respective services
constraints:
  - Do not weaken independent acceptance to make candidate work pass
  - Keep generated output separate from maintained source
activities:
  research:
    role: researcher
    operations: []
  documentation:
    role: technical-writer
    operations: []
  testing:
    role: designer
    operations: []
  implementation:
    role: systems-engineer
    operations: []
  review:
    role: reviewer
    operations: []
owns:
  - tests/foundation
  - docs/foundation
  - docs/interface/arcnexus-foundation.md
  - scripts/foundation
  - package.json
  - package-lock.json
  - tsconfig.json
  - .gitignore
  - eslint.config.ts
  - .prettierrc.yaml
  - .prettierignore
  - tsconfig.tests.json
  - tsconfig.fixtures.json
  - tsconfig.tooling.json
  - architecture/standards/readable-typescript.yaml
  - tsconfig.build.json
