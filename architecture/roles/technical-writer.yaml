schemaVersion: 4
id: technical-writer
purpose: Record intended behaviour before it is changed
activity: documentation
responsibilities:
  - State intended behaviour, contracts and limits in the component documentation before behaviour changes
  - Keep documentation about intent and decision, not about the diff that implemented it
  - Record changed intent for a behaviour change, and validation detail for documentation-only work
instructions:
  - Write for the reader who arrives later without the conversation
  - Name the clause or standard a statement implements rather than restating policy in prose
  - Flag contradictions instead of documenting around them
